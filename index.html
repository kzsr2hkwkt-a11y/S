<div class="wrap">
  <header class="top">
    <div>
      <h1>ระบบสมุดรายวันเฉพาะ</h1>
      <p class="sub">กิจการสมมติ ร้านค้าปลีกซื้อมาขายไป ไม่มีภาษีมูลค่าเพิ่ม · เดือน ส.ค. 2563 · AC101 การบัญชีเบื้องต้น</p>

  <footer>สร้างด้วย Claude AI เพื่องานวิชา AC101 ใช้ข้อมูลสมมติเท่านั้น ผู้จัดทำต้องตรวจเดบิต เครดิต และงบทดลองด้วยตนเองก่อนส่งงาน</footer>
</div>
<script>
'use strict';
/* ===== ข้อมูลหลัก: ผังบัญชี สมุดรายวัน ===== */
const MONTH = 'ส.ค.', YEAR = '2563';
const COA = [
  [11,'เงินสด'],[12,'เงินฝากธนาคาร'],[13,'ลูกหนี้การค้า'],[15,'วัสดุสำนักงาน'],[16,'เครื่องตกแต่ง'],
  [21,'เจ้าหนี้การค้า'],[22,'เจ้าหนี้อื่น'],[31,'ทุน'],
  [41,'ขาย'],[42,'รับคืนสินค้า'],[43,'ส่วนลดจ่าย'],
  [51,'ซื้อ'],[52,'ส่งคืนสินค้า'],[53,'ส่วนลดรับ'],[54,'ค่าขนส่งเข้า'],[55,'ค่าเช่า'],[56,'ค่าสาธารณูปโภค'],[57,'เงินเดือน']
];
const NAME = {}; COA.forEach(a => NAME[a[0]] = a[1]);
const BOOKS = {
  purchases: { name: 'สมุดรายวันซื้อ', code: 'ซ' },
  sales:     { name: 'สมุดรายวันขาย', code: 'ข' },
  receipts:  { name: 'สมุดรายวันรับเงิน', code: 'รง' },
  payments:  { name: 'สมุดรายวันจ่ายเงิน', code: 'จง' },
  general:   { name: 'สมุดรายวันทั่วไป', code: 'ทป' }
};
const KEY = 'ac101-special-journals-v1';

const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const dash = n => (r2(n) ? fmt(n) : '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function freshDb() { return { seq: 0, purchases: [], sales: [], receipts: [], payments: [], general: [] }; }
let db = freshDb();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function restore() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); if (d && typeof d.seq === 'number') db = Object.assign(freshDb(), d); }
  } catch (e) {}
}

/* ===== ยอดเดบิต/เครดิตของแต่ละรายการ ===== */
function sides(book, e) {
  if (book === 'purchases' || book === 'sales') return { dr: r2(e.amt), cr: r2(e.amt) };
  if (book === 'receipts') return { dr: r2(e.cash + e.bank + e.disc), cr: r2(e.ar + e.sales + e.otherAmt) };
  if (book === 'payments') return { dr: r2(e.ap + e.purch + e.otherAmt), cr: r2(e.cash + e.bank + e.pdisc) };
  let dr = 0, cr = 0;
  (e.lines || []).forEach(l => { dr += l.dr; cr += l.cr; });
  return { dr: r2(dr), cr: r2(cr) };
}

/* ===== ตรวจความถูกต้องของข้อมูลก่อนบันทึก ===== */
function check(book, e) {
  if (!Number.isInteger(e.day) || e.day < 1 || e.day > 31) return 'กรอกวันที่เป็นตัวเลข 1 ถึง 31';
  if (book === 'purchases' || book === 'sales') {
    if (!e.party) return book === 'purchases' ? 'กรอกชื่อเจ้าหนี้ (ผู้ขาย)' : 'กรอกชื่อลูกหนี้ (ลูกค้า)';
    if (!(e.amt > 0)) return 'กรอกจำนวนเงินมากกว่า 0';
    return '';
  }
  if (book === 'receipts' || book === 'payments') {
    const isR = book === 'receipts';
    const total = isR ? e.cash + e.bank + e.disc + e.ar + e.sales + e.otherAmt
                      : e.cash + e.bank + e.pdisc + e.ap + e.purch + e.otherAmt;
    if (!(total > 0)) return 'ยังไม่ได้กรอกจำนวนเงิน';
    const sub = isR ? e.ar : e.ap;
    if (sub > 0 && !(isR ? e.arParty : e.apParty)) return isR ? 'มีการรับชำระหนี้ ต้องกรอกชื่อลูกหนี้เพื่อผ่านบัญชีย่อย' : 'มีการจ่ายชำระหนี้ ต้องกรอกชื่อเจ้าหนี้เพื่อผ่านบัญชีย่อย';
    if (e.otherAmt > 0) {
      if (!NAME[e.otherAcct]) return 'เลือกบัญชีอื่นที่เกี่ยวข้อง';
      if (e.otherAcct === 13 || e.otherAcct === 21) return 'ลูกหนี้การค้าและเจ้าหนี้การค้าให้กรอกในช่องของตนเอง เพื่อให้ผ่านบัญชีย่อย';
    }
    return '';
  }
  const ls = e.lines || [];
  if (ls.length < 2) return 'สมุดรายวันทั่วไปต้องมีอย่างน้อย 2 บรรทัด';
  for (const l of ls) {
    if (!NAME[l.acct]) return 'เลือกบัญชีให้ครบทุกบรรทัด';
    if (l.dr > 0 && l.cr > 0) return 'แต่ละบรรทัดกรอกได้ทั้งเดบิตหรือเครดิตเพียงอย่างเดียว';
    if (!(l.dr > 0) && !(l.cr > 0)) return 'ทุกบรรทัดต้องมียอดเดบิตหรือเครดิต';
    if ((l.acct === 13 || l.acct === 21) && !l.party) return 'บัญชี ' + NAME[l.acct] + ' ต้องกรอกชื่อลูกหนี้/เจ้าหนี้';
  }
  return '';
}

/* ===== บันทึกรายการ (ถ้าเดบิต ≠ เครดิต จะไม่บันทึก เว้นแต่เปิดโหมดทดสอบ) ===== */
function addEntry(book, e, allowUnbalanced) {
  const err = check(book, e);
  if (err) return { ok: false, msg: err };
  const s = sides(book, e), diff = r2(s.dr - s.cr);
  if (diff !== 0 && !allowUnbalanced) {
    return { ok: false, msg: 'เดบิตไม่เท่ากับเครดิต: เดบิตรวม ' + fmt(s.dr) + ' เครดิตรวม ' + fmt(s.cr) + ' ต่างกัน ' + fmt(Math.abs(diff)) + ' บาท ระบบไม่บันทึกรายการนี้' };
  }
  e.id = ++db.seq;
  db[book].push(e);
  db[book].sort((a, b) => a.day - b.day || a.id - b.id);
  save();
  return { ok: true, unbalanced: diff !== 0, msg: diff !== 0
    ? 'บันทึกแล้วในโหมดทดสอบ แต่เดบิตไม่เท่ากับเครดิต (ต่างกัน ' + fmt(Math.abs(diff)) + ' บาท) ดูแจ้งเตือนที่งบทดลอง'
    : 'บันทึกแล้ว ระบบผ่านรายการไปบัญชีแยกประเภททั่วไปและบัญชีย่อยโดยอัตโนมัติ' };
}
function removeEntry(book, id) {
  db[book] = db[book].filter(e => e.id !== id);
  save();
}

/* ===== ผ่านรายการ: แตกแต่ละรายการในสมุดเป็นบรรทัดเดบิต/เครดิตของบัญชีแยกประเภท ===== */
function allLines() {
  const out = []; let n = 0;
  const push = (book, e, i, acct, dr, cr, desc, party) => {
    dr = r2(dr); cr = r2(cr);
    if (!dr && !cr) return;
    out.push({ book, id: e.id, ref: BOOKS[book].code + (i + 1), day: e.day, acct, dr, cr, desc, party: party || '', n: n++ });
  };
  db.purchases.forEach((e, i) => {
    push('purchases', e, i, 51, e.amt, 0, 'ซื้อสินค้า จาก ' + e.party);
    push('purchases', e, i, 21, 0, e.amt, 'ซื้อสินค้า' + (e.inv ? ' ใบกำกับ ' + e.inv : ''), e.party);
  });
  db.sales.forEach((e, i) => {
    push('sales', e, i, 13, e.amt, 0, 'ขายสินค้า' + (e.inv ? ' ใบกำกับ ' + e.inv : ''), e.party);
    push('sales', e, i, 41, 0, e.amt, 'ขายสินค้า ให้ ' + e.party);
  });
  db.receipts.forEach((e, i) => {
    const d = e.desc || 'รับเงิน';
    push('receipts', e, i, 11, e.cash, 0, d);
    push('receipts', e, i, 12, e.bank, 0, d);
    push('receipts', e, i, 43, e.disc, 0, d);
    push('receipts', e, i, 13, 0, e.ar, d, e.arParty);
    push('receipts', e, i, 41, 0, e.sales, d);
    if (e.otherAmt) push('receipts', e, i, e.otherAcct, 0, e.otherAmt, d);
  });
  db.payments.forEach((e, i) => {
    const d = e.desc || 'จ่ายเงิน';
    push('payments', e, i, 11, 0, e.cash, d);
    push('payments', e, i, 12, 0, e.bank, d);
    push('payments', e, i, 53, 0, e.pdisc, d);
    push('payments', e, i, 21, e.ap, 0, d, e.apParty);
    push('payments', e, i, 51, e.purch, 0, d);
    if (e.otherAmt) push('payments', e, i, e.otherAcct, e.otherAmt, 0, d);
  });
  db.general.forEach((e, i) => {
    e.lines.forEach(l => push('general', e, i, l.acct, l.dr, l.cr, e.desc || 'รายการทั่วไป', l.party));
  });
  out.sort((a, b) => a.day - b.day || a.id - b.id || a.n - b.n);
  return out;
}

/* บัญชีแยกประเภททั่วไป: รวมรายการตามเลขที่บัญชี พร้อมยอดคงเหลือสะสม */
function buildLedger(lines) {
  const g = {};
  lines.forEach(l => { (g[l.acct] = g[l.acct] || []).push(l); });
  const res = {};
  Object.keys(g).forEach(k => {
    let bal = 0, dr = 0, cr = 0;
    res[k] = { acct: +k, rows: g[k].map(l => { bal = r2(bal + l.dr - l.cr); dr += l.dr; cr += l.cr; return Object.assign({}, l, { bal }); }), dr: r2(dr), cr: r2(cr), bal: r2(dr - cr) };
  });
  return res;
}

/* บัญชีย่อย: ลูกหนี้การค้า (13) และเจ้าหนี้การค้า (21) แยกรายชื่อ */
function buildSub(lines, acct) {
  const m = {};
  lines.filter(l => l.acct === acct && l.party).forEach(l => { (m[l.party] = m[l.party] || []).push(l); });
  return Object.keys(m).map(name => {
    let bal = 0, dr = 0, cr = 0;
    const rows = m[name].map(l => { bal = r2(bal + l.dr - l.cr); dr += l.dr; cr += l.cr; return Object.assign({}, l, { bal }); });
    return { name, rows, dr: r2(dr), cr: r2(cr), bal: r2(dr - cr) };
  });
}

/* งบทดลอง และการเทียบบัญชีย่อยกับบัญชีคุม */
function buildTB() {
  const lines = allLines(), led = buildLedger(lines);
  const rows = COA.filter(a => led[a[0]]).map(a => {
    const net = led[a[0]].bal;
    return { acct: a[0], name: a[1], dr: net > 0 ? net : 0, cr: net < 0 ? -net : 0 };
  });
  const dr = r2(rows.reduce((s, r) => s + r.dr, 0)), cr = r2(rows.reduce((s, r) => s + r.cr, 0));
  const ar = buildSub(lines, 13), ap = buildSub(lines, 21);
  const arSum = r2(ar.reduce((s, p) => s + p.bal, 0)), apSum = r2(ap.reduce((s, p) => s + p.bal, 0));
  const arCtl = led[13] ? led[13].bal : 0, apCtl = led[21] ? led[21].bal : 0;
  return { lines, led, rows, dr, cr, balanced: dr === cr, ar, ap, arSum, apSum, arCtl, apCtl, arOk: arSum === arCtl, apOk: apSum === apCtl };
}

function loadSample() {
  db = freshDb();
  const errs = [];
  TX.forEach((t, i) => {
    const e = JSON.parse(JSON.stringify(t.e));
    e.day = t.day;
    if (t.book === 'receipts' || t.book === 'payments') Object.keys(Z).forEach(k => { if (e[k] === undefined) e[k] = Z[k]; });
    const r = addEntry(t.book, e, false);
    if (!r.ok) errs.push('รายการที่ ' + (i + 1) + ': ' + r.msg);
  });
  return errs;
}

const $ = id => document.getElementById(id);

const num = id => r2(parseFloat(val(id)) || 0);
const fld = (id, label, attrs) => '<label class="f"><span>' + label + '</span><input id="' + id + '" ' + (attrs || '') + '></label>';

function partyList(acct) {
  const names = []; allLines().forEach(l => { if (l.acct === acct && l.party && !names.includes(l.party)) names.push(l.party); });
  return '<datalist id="dl-' + acct + '">' + names.map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
}

/* ===== อ่านค่าจากฟอร์ม ===== */
function readForm(book) {
  const day = parseInt(val(book === 'purchases' ? 'pj-day' : book === 'sales' ? 'sj-day' : book === 'receipts' ? 'rc-day' : book === 'payments' ? 'pm-day' : 'gj-day'), 10);
  if (book === 'purchases' || book === 'sales') {
    const p = book === 'purchases' ? 'pj' : 'sj';
    return { day, inv: val(p + '-inv').trim(), party: val(p + '-party').trim(), terms: val(p + '-terms').trim(), amt: num(p + '-amt') };
  }
  if (book === 'receipts') {
    return { day, desc: val('rc-desc').trim(), cash: num('rc-cash'), bank: num('rc-bank'), disc: num('rc-disc'),
      ar: num('rc-ar'), arParty: val('rc-party').trim(), sales: num('rc-sales'),
      otherAcct: parseInt(val('rc-oacct'), 10) || 0, otherAmt: num('rc-oamt'), pdisc: 0, ap: 0, apParty: '', purch: 0 };
  }
  if (book === 'payments') {
    return { day, desc: val('pm-desc').trim(), cash: num('pm-cash'), bank: num('pm-bank'), pdisc: num('pm-disc'),
      ap: num('pm-ap'), apParty: val('pm-party').trim(), purch: num('pm-purch'),
      otherAcct: parseInt(val('pm-oacct'), 10) || 0, otherAmt: num('pm-oamt'), disc: 0, ar: 0, arParty: '', sales: 0 };
  }
  const lines = [...document.querySelectorAll('#gj-lines .glrow')].map(r => ({
    acct: parseInt(r.querySelector('.g-acct').value, 10) || 0,
    party: r.querySelector('.g-party').value.trim(),
    dr: r2(parseFloat(r.querySelector('.g-dr').value) || 0),
    cr: r2(parseFloat(r.querySelector('.g-cr').value) || 0)
  }));
  return { day, desc: val('gj-desc').trim(), lines };
}

function updateLive(book) {
  const out = $('live-' + book); if (!out) return;
  const s = sides(book, readForm(book));
  const diff = r2(s.dr - s.cr);
  if (!s.dr && !s.cr) { out.textContent = ''; out.className = 'live'; return; }
  out.className = 'live ' + (diff === 0 ? 'ok' : 'bad');
  out.textContent = 'เดบิตรวม ' + fmt(s.dr) + ' | เครดิตรวม ' + fmt(s.cr) + (diff === 0 ? ' | เท่ากัน' : ' | ต่างกัน ' + fmt(Math.abs(diff)));
}

function bindForm(book) {
  const f = $('f-' + book); if (!f) return;
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const r = addEntry(book, readForm(book), ui.test);
    if (!r.ok) { $('err-' + book).textContent = r.msg; return; }
    ui.flash = { book, msg: r.msg, bad: r.unbalanced };
    render();
  });
  if (book === 'receipts' || book === 'payments' || book === 'general') {
    f.addEventListener('input', () => updateLive(book));
    f.addEventListener('change', () => updateLive(book));
  }
  if (book === 'general') {
    $('gj-add').addEventListener('click', () => {
      $('gj-lines').insertAdjacentHTML('beforeend', glRow(document.querySelectorAll('#gj-lines .glrow').length));
    });
    $('gj-lines').addEventListener('click', ev => {
      if (ev.target.classList.contains('g-del')) {
        if (document.querySelectorAll('#gj-lines .glrow').length > 2) { ev.target.closest('.glrow').remove(); updateLive('general'); }
        else $('err-general').textContent = 'ต้องมีอย่างน้อย 2 บรรทัด';
      }
    });
  }
}

function ledTable(rows, endBal, label) {
  return '<div class="paper"><table style="min-width:520px"><thead><tr><th>วันที่</th><th>รายการ</th><th>อ้างอิง</th><th>เดบิต</th><th>เครดิต</th><th>คงเหลือ</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + MONTH + ' ' + r.day + '</td><td>' + esc(r.desc) + (r.party && label !== 'sub' ? '<div class="sub">' + esc(r.party) + ' ✓</div>' : '') + '</td><td class="c">' + r.ref + '</td><td class="num">' + dash(r.dr) + '</td><td class="num">' + dash(r.cr) + '</td><td class="num">' + fmt(Math.abs(r.bal)) + ' ' + (r.bal < 0 ? 'ค' : 'ด') + '</td></tr>').join('') +
    '<tr class="tot"><td colspan="3">ยอดคงเหลือ</td><td class="num">' + fmt(endBal.dr) + '</td><td class="num">' + fmt(endBal.cr) + '</td><td class="num">' + fmt(Math.abs(endBal.bal)) + ' ' + (endBal.bal < 0 ? 'ค' : 'ด') + '</td></tr></tbody></table></div>';
}
function viewLedger() {
  const tb = buildTB();
  const seg = '<div class="seg"><button class="btn ghost small" data-sub="gl" aria-pressed="' + (ui.sub === 'gl') + '" type="button">บัญชีแยกประเภททั่วไป</button>' +
    '<button class="btn ghost small" data-sub="ar" aria-pressed="' + (ui.sub === 'ar') + '" type="button">บัญชีย่อยลูกหนี้</button>' +
    '<button class="btn ghost small" data-sub="ap" aria-pressed="' + (ui.sub === 'ap') + '" type="button">บัญชีย่อยเจ้าหนี้</button></div>';
  const legend = '<div class="legend"><span>อ้างอิง: ซ = สมุดซื้อ</span><span>ข = สมุดขาย</span><span>รง = สมุดรับเงิน</span><span>จง = สมุดจ่ายเงิน</span><span>ทป = สมุดทั่วไป</span><span>ด = ยอดเดบิต ค = ยอดเครดิต</span></div>';
  if (!tb.lines.length) return '<h2>บัญชีแยกประเภท</h2>' + seg + '<div class="card muted">ยังไม่มีรายการ กดปุ่ม “โหลดตัวอย่าง” เพื่อดูการผ่านรายการอัตโนมัติ</div>';
  let body = '';
  if (ui.sub === 'gl') {
    body = '<div class="ledgers">' + COA.filter(a => tb.led[a[0]]).map(a => { const L = tb.led[a[0]]; return '<div class="card stack"><h3>' + a[1] + ' <small>เลขที่ ' + a[0] + (a[0] === 13 || a[0] === 21 ? ' · บัญชีคุม' : '') + '</small></h3>' + ledTable(L.rows, L, 'gl') + '</div>'; }).join('') + '</div>';
  } else {
    const list = ui.sub === 'ar' ? tb.ar : tb.ap;
    const ok = ui.sub === 'ar' ? tb.arOk : tb.apOk, ctl = ui.sub === 'ar' ? tb.arCtl : tb.apCtl, sm = ui.sub === 'ar' ? tb.arSum : tb.apSum;
    body = '<div class="banner ' + (ok ? 'ok' : 'bad') + '">ผลรวมบัญชีย่อย ' + fmt(Math.abs(sm)) + ' บาท ' + (ok ? 'ตรงกับ' : 'ไม่ตรงกับ') + 'บัญชีคุม ' + (ui.sub === 'ar' ? 'ลูกหนี้การค้า (13)' : 'เจ้าหนี้การค้า (21)') + ' ' + fmt(Math.abs(ctl)) + ' บาท</div>' +
      '<div class="ledgers">' + list.map(p => '<div class="card stack"><h3>' + esc(p.name) + '</h3>' + ledTable(p.rows, p, 'sub') + '</div>').join('') + '</div>';
  }
  return '<h2>บัญชีแยกประเภท</h2>' + seg + legend + body;
}

function viewTB() {
  const tb = buildTB();
  if (!tb.lines.length) return '<h2>งบทดลอง</h2><div class="card muted">ยังไม่มีรายการ กดปุ่ม “โหลดตัวอย่าง” เพื่อดูงบทดลอง</div>';
  const st = (ok, t) => '<li><strong class="' + (ok ? 'live ok' : 'live bad') + '">' + (ok ? 'ผ่าน' : 'ไม่ผ่าน') + '</strong> ' + t + '</li>';
  return '<h2>งบทดลอง ณ วันที่ 31 ' + MONTH + ' ' + YEAR + '</h2>' +
    '<div class="banner ' + (tb.balanced ? 'ok' : 'bad') + '" role="status">' + (tb.balanced ? 'งบทดลองสมดุล ยอดเดบิตเท่ากับยอดเครดิต ' + fmt(tb.dr) + ' บาท' : 'แจ้งเตือน: ยอดเดบิตไม่เท่ากับยอดเครดิต เดบิต ' + fmt(tb.dr) + ' เครดิต ' + fmt(tb.cr) + ' ต่างกัน ' + fmt(Math.abs(r2(tb.dr - tb.cr))) + ' บาท') + '</div>' +
    '<div class="paper"><table style="min-width:480px"><thead><tr><th>เลขที่บัญชี</th><th>ชื่อบัญชี</th><th>เดบิต</th><th>เครดิต</th></tr></thead><tbody>' +
    tb.rows.map(r => '<tr><td class="c">' + r.acct + '</td><td>' + r.name + '</td><td class="num">' + dash(r.dr) + '</td><td class="num">' + dash(r.cr) + '</td></tr>').join('') +
    '<tr class="tot"><td></td><td>รวม</td><td class="num">' + fmt(tb.dr) + '</td><td class="num">' + fmt(tb.cr) + '</td></tr></tbody></table></div>' +
    '<div class="card stack"><h3>รายการตรวจสอบ</h3><ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px">' +
    st(tb.balanced, 'ยอดเดบิตรวมเท่ากับยอดเครดิตรวม') +
    st(tb.arOk, 'ผลรวมบัญชีย่อยลูกหนี้ ' + fmt(Math.abs(tb.arSum)) + ' ตรงกับบัญชีคุมลูกหนี้การค้า ' + fmt(Math.abs(tb.arCtl))) +
    st(tb.apOk, 'ผลรวมบัญชีย่อยเจ้าหนี้ ' + fmt(Math.abs(tb.apSum)) + ' ตรงกับบัญชีคุมเจ้าหนี้การค้า ' + fmt(Math.abs(tb.apCtl))) +
    '</ul></div>';
}

/* ===== วาดหน้าจอ ===== */
function render() {
  const tb = buildTB();
  $('tabs').innerHTML = TABS.map(t => '<button role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (ui.tab === t[0]) + '">' + t[1] + (BOOKS[t[0]] && db[t[0]].length ? '<span class="cnt">' + db[t[0]].length + '</span>' : '') + '</button>').join('');
  $('alert').innerHTML = tb.lines.length && (!tb.balanced || !tb.arOk || !tb.apOk)
    ? '<div class="banner bad">แจ้งเตือน: ' + (!tb.balanced ? 'งบทดลองไม่สมดุล ต่างกัน ' + fmt(Math.abs(r2(tb.dr - tb.cr))) + ' บาท ' : '') + (!tb.arOk || !tb.apOk ? 'บัญชีย่อยไม่ตรงกับบัญชีคุม' : '') + '</div>' : '';
  if (!tb.lines.length) $('alert').innerHTML = '<div class="banner info">กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</div>';
  const v = ui.tab;
  $('view').innerHTML = v === 'home' ? viewHome() : v === 'tx' ? viewTx() : v === 'ledger' ? viewLedger() : v === 'tb' ? viewTB() : viewJournal(v);
  if (BOOKS[v]) bindForm(v);
  ui.flash = null;
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-tab],[data-sub],[data-del]'); if (!t) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.sub) { ui.sub = t.dataset.sub; render(); }
  else if (t.dataset.del) { const [b, id] = t.dataset.del.split(':'); removeEntry(b, parseInt(id, 10)); render(); }
  else if (t.dataset.act === 'load') { loadSample(); if (ui.tab === 'home') ui.tab = 'tx'; render(); }
  else if (t.dataset.act === 'clear') { db = freshDb(); save(); render(); }
});
document.addEventListener('change', ev => { if (ev.target.id === 'test-mode') { ui.test = ev.target.checked; } });

restore();
render();
</script>

</body></html>
